modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="rpcore"
    mandatory=true
    versionRange="[0.8.0,)"
    ordering="AFTER"
    side="BOTH"

# FL Render: свет порталов (общий проход цветного света), шейдерпак, настройки графики. Только клиент.
[[dependencies.${mod_id}]]
    modId="flrender"
    mandatory=true
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="CLIENT"
